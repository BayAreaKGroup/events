name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: knight2026/package-lock.json

      - name: Install knight2026
        working-directory: knight2026
        run: npm ci

      - name: Build knight2026 (Next.js static export)
        working-directory: knight2026
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p site
          cp index.html site/
          cp -r knight2026/out site/knight2026
          # Styled 404 for the whole Pages site (assets use absolute /events/knight2026/ paths)
          cp knight2026/out/404.html site/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
